<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waypoint - NASA</title>
  <link rel="icon" type="image/png" href="mcbs.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #map { background: #111; }
    .walk-info { background: #fff; color: #222; padding: 8px 12px; border-radius: 5px; font: 13px/1.5 sans-serif; }
    .walk-info h2 { margin: 0 0 4px; font-size: 14px; }
    .walk-info small { color: #555; }
    .walk-info .steep { color: #d40000; font-weight: bold; }
    .walk-info h3 { margin: 8px 0 2px; font-size: 13px; }
    .walk-info .line { display: inline-block; width: 18px; height: 4px; margin-right: 6px; vertical-align: middle; }
    .walk-info .dot { display: inline-block; width: 10px; height: 10px; margin: 0 9px 0 3px; border: 1px solid #000; border-radius: 50%; background: #ffe600; vertical-align: middle; }
    .walk-info { max-width: 250px; }
    .walk-info small { display: block; }
    .stop-science { margin-top: 6px; }
    .stop-sources { margin-top: 4px; font-size: 11px; }
    .stop-photos { display: flex; gap: 6px; margin-top: 8px; }
    .stop-photos figure { margin: 0; width: 120px; }
    .stop-photos img { display: block; width: 100%; height: 90px; object-fit: cover; }
    .stop-photos figcaption { font-size: 11px; line-height: 1.3; color: #555; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="m20.js"></script>
  <script src="walk.js"></script>
  <script src="photos.js"></script>
  <script src="science.js"></script>
  <script src="terrain.js"></script>
  <script src="clock.js"></script>
  <script>
    // Mars tiles use plain lat/lon, not the Web Mercator projection Earth maps use.
    const map = L.map('map', { crs: L.CRS.EPSG4326, minZoom: 1, maxZoom: 18 })
      .setView([18.44, 77.45], 11); // Jezero Crater

    // CTX tiles are 512px and their zoom levels start one lower than Leaflet's.
    const ctx = L.tileLayer('https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX1/MapServer/tile/{z}/{y}/{x}', {
      tileSize: 512,
      zoomOffset: -1,
      maxNativeZoom: 13, // the service lists deeper levels, but they return errors
      attribution: 'CTX: NASA/JPL/MSSS/The Murray Lab, hosted by Esri'
    }).addTo(map);

    // maxNativeZoom: deepest level Trek has tiles for. Past it, Leaflet stretches those tiles.
    const trek = 'https://trek.nasa.gov/tiles/Mars/EQ/';
    const mola = L.tileLayer(trek + 'Mars_MGS_MOLA_ClrShade_merge_global_463m/1.0.0/default/default028mm/{z}/{y}/{x}.jpg', {
      maxNativeZoom: 7,
      attribution: 'MOLA: NASA/JPL/GSFC, via NASA Mars Trek'
    });
    const themis = L.tileLayer(trek + 'THEMIS_DayIR_ControlledMosaics_100m_v2_oct2018/1.0.0/default/default028mm/{z}/{y}/{x}.png', {
      maxNativeZoom: 9,
      attribution: 'THEMIS: NASA/JPL/ASU, via NASA Mars Trek'
    });

    // Its own pane keeps the photo above the map layers but under the route lines.
    map.createPane('hirise').style.zIndex = 350;
    const hirise = L.imageOverlay(TERRAIN.hiriseWalk.url, TERRAIN.hiriseWalk.bounds, {
      pane: 'hirise',
      attribution: 'HiRISE: NASA/JPL/University of Arizona'
    }).addTo(map);

    // Above the photos, under the route lines. HiRISE detail near the walk, CTX for the wider area.
    map.createPane('slopes').style.zIndex = 360;
    const slopeMap = L.layerGroup([
      L.imageOverlay(TERRAIN.slopeCtx.url, TERRAIN.slopeCtx.bounds, { pane: 'slopes' }),
      L.imageOverlay(TERRAIN.slopeHirise.url, TERRAIN.slopeHirise.bounds, { pane: 'slopes' })
    ]).addTo(map);

    // Leaflet wants [lat, lon]; the rover data stores lon first.
    const roverPath = L.polyline(M20.map(([lon, lat]) => [lat, lon]), {
      color: '#ff7a00',
      weight: 3,
      attribution: 'Rover path: NASA/JPL-Caltech'
    }).addTo(map);

    const toLatLon = ([lon, lat]) => [lat, lon];
    const walkStops = M20.slice(WALK_FIRST_STOP, WALK_LAST_STOP + 1);
    const stats = walkStats(walkStops);
    const walkRoute = L.layerGroup([
      L.polyline(walkStops.map(toLatLon), { color: '#00c8ff', weight: 6 }),
      L.polyline(TERRAIN.walkSlopes.steepParts, { color: '#ff0000', weight: 6 })
    ]).addTo(map);

    const CAMERAS = {
      MCZ_LEFT: 'Mastcam-Z. NASA/JPL-Caltech/ASU',
      NAVCAM_LEFT: 'Navcam. NASA/JPL-Caltech'
    };
    const photoHtml = ({ sol, camera, thumb, page }) => `
      <figure>
        <a href="${page}" target="_blank" rel="noopener"><img src="${thumb}" alt="Perseverance photo from sol ${sol}"></a>
        <figcaption>Sol ${sol}, ${CAMERAS[camera]}</figcaption>
      </figure>`;

    const sciencePins = L.layerGroup(scienceStops(walkStops).map(({ stop, fromSol, toSol }, i) =>
      L.circleMarker(toLatLon(stop), { radius: 7, color: '#000', weight: 1, fillColor: '#ffe600', fillOpacity: 1 })
        .bindPopup(`<b>Science stop ${i + 1}: ${STOP_SCIENCE[i].place}</b><br>
          Rover stayed ${toSol - fromSol} sols (sol ${fromSol} to ${toSol})<br>
          Height: ${Math.round(stop[2])} m
          <div class="stop-science"><b>What the rover did:</b> ${STOP_SCIENCE[i].did}</div>
          <div class="stop-science"><b>Why it matters:</b> ${STOP_SCIENCE[i].why}</div>
          <div class="stop-sources">Sources: ${STOP_SCIENCE[i].sources.map((name, n) => `<a href="${SOURCES[name]}" target="_blank" rel="noopener">NASA ${n + 1}</a>`).join(', ')}</div>
          <div class="stop-photos">${STOP_PHOTOS[i].map(photoHtml).join('')}</div>`, { maxWidth: 400 })
    )).addTo(map);

    L.control.layers({
      'CTX photos': ctx,
      'MOLA height colors': mola,
      'THEMIS infrared': themis
    }, {
      'HiRISE sharp photo': hirise,
      'Slope map': slopeMap,
      'Perseverance path': roverPath,
      'Marswalk route': walkRoute,
      'Science stops': sciencePins
    }, { collapsed: false }).addTo(map);

    const LAYER_COLORS = {
      'CTX photos': 'Map: a black-and-white photo of the ground.',
      'MOLA height colors': 'Map: blue = lower, green = middle, yellow = higher. Black and white spots = shadows and sunlit slopes.',
      'THEMIS infrared': 'Map: bright = warmer ground, dark = colder ground (daytime).'
    };

    const walkInfo = L.control({ position: 'bottomleft' });
    walkInfo.onAdd = () => {
      const box = L.DomUtil.create('div', 'walk-info');
      box.innerHTML = `
        <h2>Marswalk route</h2>
        <a href="view3d.html">Open 3D view</a><br>
        Distance: ${(stats.distanceM / 1000).toFixed(1)} km<br>
        Highest point: ${Math.round(stats.highestM)} m<br>
        Lowest point: ${Math.round(stats.lowestM)} m<br>
        Total climb: ${Math.round(stats.climbM)} m<br>
        <span class="steep">Steep parts: ${TERRAIN.walkSlopes.steepMeters} m (${TERRAIN.walkSlopes.steepPercent}% of walk)</span><br>
        Steepest point: ${TERRAIN.walkSlopes.steepestDegrees}&deg;<br>
        <small>Heights are relative to Mars's average level.</small>
        <h3>Color guide</h3>
        <span class="line" style="background: #ff7a00"></span>Rover's full path<br>
        <span class="line" style="background: #00c8ff"></span>Marswalk route<br>
        <span class="line" style="background: #ff0000"></span>Steep: ${TERRAIN.walkSlopes.steepDegrees}&deg; or more (HiRISE)<br>
        <span class="dot"></span>Science stop: rover stayed ${SCIENCE_STAY_SOLS}+ sols<br>
        ${TERRAIN.slopeBands.map(([from, to, color]) => `<span class="line" style="height: 10px; background: rgb(${color})"></span>Ground ${to ? `${from}-${to}` : `${from}+`}&deg;<br>`).join('')}
        <small id="layer-colors">${LAYER_COLORS['CTX photos']}</small>
        <small>Sharp patch around the walk: HiRISE photo. Untick it to see the layer underneath.</small>`;
      return box;
    };
    walkInfo.addTo(map);

    map.on('baselayerchange', e => {
      document.getElementById('layer-colors').textContent = LAYER_COLORS[e.name];
    });

    const clockBox = L.control({ position: 'topleft' });
    clockBox.onAdd = () => L.DomUtil.create('div', 'walk-info');
    clockBox.addTo(map);

    function showMarsTime() {
      const now = marsClock(new Date());
      const elevation = Math.round(Math.abs(now.sunElevation));
      clockBox.getContainer().innerHTML = `
        <h2>Mars clock at Jezero</h2>
        Sol ${now.sol}, ${formatHours(now.meanHours)}<br>
        Sun: ${now.sunElevation > 0 ? `up, ${elevation}&deg; above` : `down, ${elevation}&deg; below`} the horizon<br>
        <small>Ignores crater walls and dust.</small>`;
    }
    showMarsTime();
    setInterval(showMarsTime, 1000);
  </script>
</body>
</html>
